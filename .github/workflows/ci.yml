name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        java: ["17", "21"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}

      - name: Compile
        run: javac -encoding UTF-8 -Xlint:none -d out src/TrabalhoFinal/*.java

      - name: Smoke test (scripted input)
        run: |
          printf '1\nMusica3\nCantor3\n1\nCantor1\n1\nmusica0\n' \
            | java -Dstdout.encoding=UTF-8 -cp out TrabalhoFinal.Principal | tee output.txt
          grep -q "Musica3 tocada por Cantor3 foi adicionado com sucesso" output.txt
          grep -q "Cantor1 foi excluido com sucesso" output.txt
          grep -q "musica0 foi encontrado na playlist: Musica0 - Cantor0" output.txt
          test "$(grep -c 'Quantidade total' output.txt)" -eq 3
